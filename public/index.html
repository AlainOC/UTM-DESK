<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UTM Desk — Consola operativa de gestión de incidencias de cómputo, redes, infraestructura y plataformas académicas del campus universitario.">
  <title>UTM Desk — Mesa de Incidencias del Campus</title>

  <!-- Fuentes Tipográficas: IBM Plex Sans (UI) y IBM Plex Mono (Datos Técnicos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 (Solo utilidades, grid y comportamientos accesibles) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Sistema de Diseño Operativo Propio -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Chart.js 4.4 para Analítica -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- Enlace accesible para saltar navegación -->
  <a href="#app-view-container" class="visually-hidden-focusable p-2 bg-dark text-white position-absolute top-0 start-0 z-3">
    Saltar directamente al contenido principal
  </a>

  <!-- Barra de Navegación Institucional — Consola de Operaciones -->
  <header class="app-navbar" role="banner">
    <div class="container-fluid px-lg-4 d-flex flex-wrap align-items-center justify-content-between gap-3">
      
      <!-- Identidad y Marca de Centro de Operaciones -->
      <div class="d-flex align-items-center gap-3">
        <a href="#/tablero" class="brand-wrapper" aria-label="UTM Desk - Consola de Operaciones">
          <div class="brand-icon font-mono" aria-hidden="true">UTM</div>
          <div class="brand-text">
            <div class="d-flex align-items-center gap-2">
              <span class="brand-title">UTM Desk</span>
              <span class="system-status-led" title="Sistema operativo en línea">
                <span class="led-dot" aria-hidden="true"></span> ONLINE
              </span>
            </div>
            <span class="brand-subtitle">Campus Operations Console • v2.4</span>
          </div>
        </a>
      </div>

      <!-- Menú de Navegación Táctico -->
      <nav class="d-flex align-items-center gap-1 flex-wrap" role="navigation" aria-label="Navegación principal">
        <a href="#/tablero" id="nav-tablero" class="nav-link-custom active">
          <span class="nav-icon" aria-hidden="true">⊞</span> Tablero Ops
        </a>
        <a href="#/registro" id="nav-registro" class="nav-link-custom">
          <span class="nav-icon" aria-hidden="true">+</span> Nuevo Reporte
        </a>
        <a href="#/busqueda" id="nav-busqueda" class="nav-link-custom">
          <span class="nav-icon" aria-hidden="true">🔍</span> Búsqueda
        </a>
        <a href="#/analitica" id="nav-analitica" class="nav-link-custom">
          <span class="nav-icon" aria-hidden="true">📊</span> Analítica
        </a>
      </nav>

      <!-- Indicadores de Entorno y Control de Tema -->
      <div class="d-flex align-items-center gap-2">
        <span id="mock-badge-indicator" class="badge-mock font-mono" title="Operando con almacén de datos en memoria">
          MOCK DATA
        </span>
        <button type="button" id="theme-toggle-btn" class="btn-custom-secondary btn-custom-sm" title="Alternar tema claro / oscuro" aria-label="Alternar tema claro u oscuro">
          <span id="theme-icon" aria-hidden="true">🌓</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Contenedor Principal de Vistas -->
  <main id="app-view-container" class="app-main container-fluid px-lg-4" role="main" tabindex="-1">
    <!-- El router montará aquí las vistas dinámicas -->
  </main>

  <!-- Contenedor de Toasts Accesibles -->
  <div id="app-toasts" class="toast-container-custom" aria-live="polite" aria-atomic="true"></div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Aplicación SPA Vanilla ES Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
