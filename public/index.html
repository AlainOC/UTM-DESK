<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="UTM Desk — Consola operativa de gestión de incidencias de cómputo, redes, infraestructura y plataformas académicas del campus universitario.">
  <title>UTM Desk — Mesa de Incidencias del Campus</title>

  <!-- Fuentes Tipográficas: IBM Plex Sans (UI) y IBM Plex Mono (Datos Técnicos) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Bootstrap 5.3 (Solo utilidades, grid y comportamientos accesibles) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Sistema de Diseño Operativo Propio -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Chart.js 4.4 para Analítica -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>

<body>
  <!-- Enlace accesible para saltar navegación -->
  <a href="#app-view-container"
    class="visually-hidden-focusable p-2 bg-dark text-white position-absolute top-0 start-0 z-3">
    Saltar directamente al contenido principal
  </a>

  <!-- Barra de Navegación Institucional — Consola de Operaciones -->
  <header class="app-navbar app-navbar-v1" role="banner">
    <div class="container-fluid px-lg-4 d-flex align-items-center justify-content-between gap-3">
      
      <!-- Bloque Izquierdo: Marca + Separador + Accesos Operativos -->
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <a href="#/tablero" class="brand-wrapper text-decoration-none" aria-label="UTM Desk - Consola de Operaciones">
          <div class="brand-icon font-mono" aria-hidden="true">NOC</div>
          <div class="brand-text">
            <div class="d-flex align-items-center gap-2">
              <span class="brand-title">UTM Desk</span>
              <span class="system-status-led" style="padding: 2px 6px; font-size: 0.72rem;">
                <span class="led-dot" aria-hidden="true"></span> LIVE
              </span>
            </div>
            <span class="brand-subtitle font-mono" style="font-size: 0.72rem; color: var(--accent-primary);">NODE // CORE-01</span>
          </div>
        </a>

        <div class="navbar-vr d-none d-md-block" aria-hidden="true"></div>

        <nav class="d-flex align-items-center gap-2 flex-wrap" role="navigation" aria-label="Navegación principal">
          <a href="#/tablero" id="nav-tablero" class="nav-deck-pill active">
            <span>⊞ Tablero</span>
          </a>
          <a href="#/registro" id="nav-registro" class="nav-deck-pill">
            <span>+ Nuevo</span>
          </a>
          <a href="#/busqueda" id="nav-busqueda" class="nav-deck-pill">
            <span>🔍 Buscar</span>
          </a>
          <a href="#/analitica" id="nav-analitica" class="nav-deck-pill">
            <span>📊 Métricas</span>
          </a>
        </nav>
      </div>

      <!-- Bloque Central: Indicador de Contexto Operativo por Rol (elimina el espacio muerto) -->
      <div class="navbar-center-context d-none d-xl-flex align-items-center" id="navbar-role-context"></div>

      <!-- Bloque Derecho: Herramientas + Perfil de Usuario + Salir -->
      <div class="d-flex align-items-center gap-2" id="navbar-right-cluster">
        <span id="mock-badge-indicator" class="badge-mock font-mono" title="Operando con almacén de datos en memoria">
          MOCK DATA
        </span>
        <button type="button" id="theme-toggle-btn" class="btn-custom-secondary btn-custom-sm"
          title="Alternar tema claro / oscuro" aria-label="Alternar tema claro u oscuro">
          <span id="theme-icon" aria-hidden="true">🌓</span>
        </button>
        <div id="navbar-user-slot" class="d-flex align-items-center gap-2"></div>
      </div>

    </div>
  </header>

  <!-- Contenedor Principal de Vistas -->
  <main id="app-view-container" class="app-main container-fluid px-lg-4" role="main" tabindex="-1">
    <!-- El router montará aquí las vistas dinámicas -->
  </main>

  <!-- Contenedor de Toasts Accesibles -->
  <div id="app-toasts" class="toast-container-custom" aria-live="polite" aria-atomic="true"></div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Aplicación SPA Vanilla ES Modules -->
  <script type="module" src="js/app.js"></script>
<!-- impeccable-live-start -->
<script src="http://localhost:8400/live.js?token=cea38812-3d23-4067-93ec-a71480848b76"></script>
<!-- impeccable-live-end -->
</body>

</html>
